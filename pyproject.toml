[project]
name = "ezql"
version = "0.0.1"
description = "An easy way to talk to your database."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "httpx>=0.28.1",
    "langchain[openai]>=1.3.1",
    "openai>=2.37.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sqlmodel>=0.0.38",
    "streamlit>=1.57.0",
]

[dependency-groups]
backend = [
    "fastapi>=0.136.1",
    "langchain[openai]>=1.3.1",
    "openai>=2.37.0",
    "pydantic>=2.13.4",
    "sqlmodel>=0.0.38",
]
dev = [
    "basedpyright>=1.39.5",
    "poethepoet>=0.46.0",
    "ruff>=0.15.13",
]
frontend = [
    "streamlit>=1.57.0",
]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.poe.tasks]
run-app = { shell = "PIDS=$(lsof -ti tcp:8000); if [ -n \"$PIDS\" ]; then kill $PIDS; sleep 2; PIDS=$(lsof -ti tcp:8000); if [ -n \"$PIDS\" ]; then kill -9 $PIDS; sleep 1; fi; fi; trap 'kill $BACKEND_PID' EXIT; uv run fastapi dev backend/main.py --host 127.0.0.1 --port 8000 & BACKEND_PID=$!; sleep 2; uv run streamlit run frontend/app.py", help = "Run FastAPI backend and Streamlit frontend" }
