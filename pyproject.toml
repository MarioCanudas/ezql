[project]
name = "ezql"
version = "0.0.1"
description = "An easy way to talk to your database."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "langchain[openai]>=1.3.1",
    "openai>=2.37.0",
    "pydantic>=2.13.4",
    "sqlmodel>=0.0.38",
    "streamlit>=1.57.0",
]

[dependency-groups]
backend = [
    "fastapi>=0.136.1",
    "langchain[openai]>=1.3.1",
    "openai>=2.37.0",
    "pydantic>=2.13.4",
    "sqlmodel>=0.0.38",
]
dev = [
    "basedpyright>=1.39.5",
    "ruff>=0.15.13",
]
frontend = [
    "streamlit>=1.57.0",
]
